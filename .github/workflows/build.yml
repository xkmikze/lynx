name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false
  GH_TOKEN: ${{ github.token }}

jobs:

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx electron-builder --win --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*.exe

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate icns icon
        run: |
          brew install imagemagick
          mkdir -p assets/icons/icon.iconset
          convert assets/icons/icon.png -resize 16x16     assets/icons/icon.iconset/icon_16x16.png
          convert assets/icons/icon.png -resize 32x32     assets/icons/icon.iconset/icon_16x16@2x.png
          convert assets/icons/icon.png -resize 32x32     assets/icons/icon.iconset/icon_32x32.png
          convert assets/icons/icon.png -resize 64x64     assets/icons/icon.iconset/icon_32x32@2x.png
          convert assets/icons/icon.png -resize 128x128   assets/icons/icon.iconset/icon_128x128.png
          convert assets/icons/icon.png -resize 256x256   assets/icons/icon.iconset/icon_128x128@2x.png
          convert assets/icons/icon.png -resize 256x256   assets/icons/icon.iconset/icon_256x256.png
          convert assets/icons/icon.png -resize 512x512   assets/icons/icon.iconset/icon_256x256@2x.png
          convert assets/icons/icon.png -resize 512x512   assets/icons/icon.iconset/icon_512x512.png
          convert assets/icons/icon.png -resize 1024x1024 assets/icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icons/icon.iconset -o assets/icons/icon.icns
      - run: npx electron-builder --mac --x64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: dist/*.dmg

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate icns icon
        run: |
          brew install imagemagick
          mkdir -p assets/icons/icon.iconset
          convert assets/icons/icon.png -resize 16x16     assets/icons/icon.iconset/icon_16x16.png
          convert assets/icons/icon.png -resize 32x32     assets/icons/icon.iconset/icon_16x16@2x.png
          convert assets/icons/icon.png -resize 32x32     assets/icons/icon.iconset/icon_32x32.png
          convert assets/icons/icon.png -resize 64x64     assets/icons/icon.iconset/icon_32x32@2x.png
          convert assets/icons/icon.png -resize 128x128   assets/icons/icon.iconset/icon_128x128.png
          convert assets/icons/icon.png -resize 256x256   assets/icons/icon.iconset/icon_128x128@2x.png
          convert assets/icons/icon.png -resize 256x256   assets/icons/icon.iconset/icon_256x256.png
          convert assets/icons/icon.png -resize 512x512   assets/icons/icon.iconset/icon_256x256@2x.png
          convert assets/icons/icon.png -resize 512x512   assets/icons/icon.iconset/icon_512x512.png
          convert assets/icons/icon.png -resize 1024x1024 assets/icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icons/icon.iconset -o assets/icons/icon.icns
      - run: npx electron-builder --mac --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/*.dmg

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - run: npx electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - run: npx electron-builder --linux --arm64 --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/*.AppImage
            dist/*.deb

  build-linux-armv7l:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - run: npx electron-builder --linux --armv7l --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-armv7l
          path: |
            dist/*.AppImage
            dist/*.deb

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-mac-x64
      - build-mac-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-linux-armv7l
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-x64/*.exe
            windows-arm64/*.exe
            mac-x64/*.dmg
            mac-arm64/*.dmg
            linux-x64/*.AppImage
            linux-x64/*.deb
            linux-arm64/*.AppImage
            linux-arm64/*.deb
            linux-armv7l/*.AppImage
            linux-armv7l/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
